version: 1.0

# Anthropic/Claude access via omniroute is currently broken (401 invalid
# x-api-key, unresolved) — Ollama is primary everywhere for now. See ADR-007.
# claude-* model definitions are kept below so re-enabling them later is a
# routing_rules edit, not a rewrite.

defaults:
  primary_model: ollama-local
  fallback_chain: []
  timeout_seconds: 60
  retry_attempts: 3

routing_rules:
  presentation:
    primary: ollama-local
    fallback: false
    reason: "Ollama primary while Anthropic access is unresolved (ADR-007)"
    budget_aware: false
    confidence_threshold: 0.8

  report:
    primary: ollama-local
    fallback: false
    reason: "Ollama primary while Anthropic access is unresolved (ADR-007)"
    budget_aware: true

  email:
    primary: ollama-local
    fallback: false
    reason: "Ollama primary while Anthropic access is unresolved (ADR-007)"
    confidence_threshold: 0.85

  task_classification:
    primary: ollama-local
    fallback: false
    reason: "Fast, deterministic, no need for a large model"
    confidence_threshold: 0.7

  analysis:
    primary: ollama-local
    fallback: false
    reason: "Ollama primary while Anthropic access is unresolved (ADR-007)"

  research:
    primary: ollama-local
    fallback: false
    reason: "Ollama primary while Anthropic access is unresolved (ADR-007)"

hybrid_mode:
  enabled: false
  reason: "Observer pattern assumed a working cloud primary to compare against; paused until Anthropic access is restored (ADR-007)"
  observer_models: [ollama-local]
  sync_interval_tasks: 10
  suggest_override_threshold: 0.95

models:
  claude-opus:
    api_provider: anthropic
    api_model_id: claude-opus-5
    cost_per_1k_tokens: 0.015
    speed_tier: slow
    reasoning_quality: excellent
    supports_web_search: true
    context_window: 200000

  claude-sonnet:
    api_provider: anthropic
    api_model_id: claude-sonnet-5
    cost_per_1k_tokens: 0.003
    speed_tier: medium
    reasoning_quality: good
    supports_web_search: true
    context_window: 200000

  ollama-local:
    api_provider: local
    api_model_id: llama3.1  # поменяй на реальный тег после `ollama pull <model>`
    cost_per_1k_tokens: 0.0
    speed_tier: very-fast
    reasoning_quality: medium
    supports_web_search: false
    context_window: 8192

fallback_behavior:
  max_retries: 3
  retry_delay_seconds: 2
  backoff_strategy: exponential
  notify_on_fallback: true

cost_tracking:
  enabled: true
  monthly_budget_dollars: 100
  alert_threshold_percent: 80
  log_to_db: true
